name: Dictionary validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLOWER_TEST_SCRATCH: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python -m unittest scripts.test_lexicon scripts.test_phrases scripts.test_categories
      - run: python scripts/build_lexicon.py --check
      - run: python scripts/build_phrases.py --check
      - run: python scripts/build_categories.py --check
      - run: cargo package --locked --allow-dirty
